name: Ruby on Rails CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: coopcom_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.10

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      - name: Set up database and run tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: password
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          PARALLEL_WORKERS: 2
          CI: true
        run: PARALLEL_WORKERS=2 bin/rails test

  # Les tests système ne sont pas lancés sur la CI. Pour les réactiver :
  # décommenter ce job ET remettre `system-test` dans le `needs` du job deploy.
  # Ne pas remettre PARALLEL_WORKERS ici : un worker système fait tourner Chrome,
  # Puma et Ruby à la fois, et le runner n'a que 2 vCPU.
  #
  # system-test:
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 30
  #
  #   services:
  #     postgres:
  #       image: postgres:15
  #       env:
  #         POSTGRES_DB: coopcom_test
  #         POSTGRES_USER: postgres
  #         POSTGRES_PASSWORD: password
  #       ports:
  #         - 5432:5432
  #       options: >-
  #         --health-cmd="pg_isready -U postgres"
  #         --health-interval=10s
  #         --health-timeout=5s
  #         --health-retries=5
  #
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #
  #     - name: Set up Ruby
  #       uses: ruby/setup-ruby@v1
  #       with:
  #         ruby-version: 3.4.10
  #
  #     - name: Install dependencies
  #       run: |
  #         gem install bundler
  #         bundle install
  #
  #     # Chrome est préinstallé sur les runners ubuntu-latest ; la version est
  #     # journalisée pour que sa disparition se lise dans le log.
  #     - name: Version de Chrome
  #       run: google-chrome --version
  #
  #     - name: Set up database and run system tests
  #       env:
  #         PGHOST: localhost
  #         PGUSER: postgres
  #         PGPASSWORD: password
  #         RAILS_ENV: test
  #         RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
  #         CI: true
  #       run: bin/rails test:system
  #
  #     - name: Capture des captures d'écran en cas d'échec
  #       if: failure()
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: captures-echecs
  #         path: |
  #           tmp/screenshots
  #           tmp/capybara
  #         if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Déployer la démo (staging)
        if: github.ref == 'refs/heads/staging'
        uses: hatchboxio/github-hatchbox-deploy-action@v2
        with:
          deploy_key: ${{ secrets.HATCHBOX_DEPLOY_KEY_STAGING }}

      - name: Déployer la production (main)
        if: github.ref == 'refs/heads/main'
        uses: hatchboxio/github-hatchbox-deploy-action@v2
        with:
          deploy_key: ${{ secrets.HATCHBOX_DEPLOY_KEY_PRODUCTION }}
