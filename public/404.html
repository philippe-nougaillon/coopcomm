<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable - AIKKU</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    /* Thème corporate de DaisyUI */
    :root {
      --primary: #4b6bfb;
      --primary-hover: #3d5beb;
      --primary-content: #ffffff;
      --base-100: #ffffff;
      --base-200: #f1f1f3;
      --base-300: #e1e1e3;
      --base-content: #181a2a;
      --base-content-muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--base-100);
      color: var(--base-content);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar — cachée sur mobile, visible à partir de lg (1024px) */
    .navbar {
      display: none;
    }

    @media (min-width: 1024px) {
      .navbar {
        display: flex;
        align-items: center;
        background-color: var(--base-100);
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        padding: 0;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
        min-height: 4rem;
      }

      main {
        padding-top: 4rem;
      }
    }

    .navbar-inner {
      display: flex;
      align-items: center;
      flex: 1;
    }

    .navbar-logo {
      height: 2rem;
      padding-right: 0.25rem;
      margin-left: 1.5rem;
      display: block;
    }

    /* Main content */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      text-align: center;
      max-width: 32rem;
    }

    .icon {
      font-size: 96px;
      color: var(--primary);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 5rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 1rem;
      color: var(--base-content);
    }

    @media (min-width: 1024px) {
      h1 {
        font-size: 7rem;
      }
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--base-content);
    }

    @media (min-width: 1024px) {
      h2 {
        font-size: 1.875rem;
      }
    }

    p {
      color: var(--base-content-muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      justify-content: center;
    }

    @media (min-width: 640px) {
      .actions {
        flex-direction: row;
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      border: 2px solid transparent;
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--primary-content);
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--primary);
      border-color: var(--primary);
    }

    .btn-outline:hover {
      background-color: var(--primary);
      color: var(--primary-content);
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--base-content);
      border-color: transparent;
    }

    .btn-ghost:hover {
      background-color: var(--base-200);
    }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="/">
        <img src="assets/CoopComm.png" alt="CoopComm" class="navbar-logo">
      </a>
    </div>
  </header>

  <main>
    <div class="container">
      <span class="material-symbols-outlined icon">search_off</span>
      <h1>404</h1>
      <h2>Page introuvable</h2>
      <p>Désolé, la page que vous recherchez n'existe pas ou a été déplacée.</p>
      <div class="actions">
        <button onclick="history.length > 1 ? history.back() : location.href='/'" class="btn btn-outline">
          <span class="material-symbols-outlined">arrow_back</span>
          Page précédente
        </button>
        <a href="/" class="btn btn-primary">
          <span class="material-symbols-outlined">home</span>
          Accueil
        </a>
      </div>
    </div>
  </main>
</body>

</html>
