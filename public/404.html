<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page introuvable - CoopComm.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@8..144,100..1000&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <style>
      /* Thème corporate de DaisyUI */
      :root {
        --primary: #0082ce;
        --primary-hover: #0082ce;
        --primary-content: #ffffff;
        --base-100: #ffffff;
        --base-200: #e8e8e8;
        --base-300: #d1d1d1;
        --base-content: #181a2a;
        --base-content-muted: #6b7280;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background-color: var(--base-100);
        color: var(--base-content);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Navbar — cachée sur mobile, visible à partir de lg (1024px) */
      .navbar {
        display: none;
      }

      @media (min-width: 1024px) {
        .navbar {
          display: flex;
          align-items: center;
          background-color: var(--base-100);
          box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
          padding: 0;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          z-index: 200;
          min-height: 4rem;
        }

        main {
          padding-top: 4rem;
        }
      }

      .navbar-inner {
        display: flex;
        align-items: center;
        flex: 1;
      }

      .navbar-logo {
        height: 2rem;
        padding-right: 0.25rem;
        margin-left: 1.5rem;
        display: block;
      }

      /* Main content */
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .container {
        text-align: center;
        max-width: 32rem;
      }

      .icon {
        width: 96px;
        height: 96px;
        display: block;
        margin: 0 auto 1.5rem;
        color: var(--primary);
      }

      .btn-icon {
        width: 1.25em;
        height: 1.25em;
        flex-shrink: 0;
      }

      h1 {
        font-size: 5rem;
        font-weight: 700;
        line-height: 1;
        margin-bottom: 1rem;
        color: var(--base-content);
      }

      @media (min-width: 1024px) {
        h1 {
          font-size: 7rem;
        }
      }

      h2 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        color: var(--base-content);
      }

      @media (min-width: 1024px) {
        h2 {
          font-size: 1.875rem;
        }
      }

      p {
        color: var(--base-content-muted);
        margin-bottom: 2rem;
        line-height: 1.5;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        justify-content: center;
      }

      @media (min-width: 640px) {
        .actions {
          flex-direction: row;
        }
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 0.875rem;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
        border: 2px solid transparent;
      }

      .btn-primary {
        background-color: var(--primary);
        color: var(--primary-content);
        border-color: var(--primary);
      }

      .btn-primary:hover {
        background-color: var(--primary-hover);
        border-color: var(--primary-hover);
      }

      .btn-outline {
        background-color: transparent;
        color: var(--primary);
        border-color: var(--primary);
      }

      .btn-outline:hover {
        background-color: var(--primary);
        color: var(--primary-content);
      }

      .btn-ghost {
        background-color: transparent;
        color: var(--base-content);
        border-color: transparent;
      }

      .btn-ghost:hover {
        background-color: var(--base-200);
      }
    </style>
  </head>

  <body>
    <header class="navbar">
      <div class="navbar-inner">
        <a href="/">
          <img src="/CoopComm.png" alt="CoopComm" class="navbar-logo" />
        </a>
      </div>
    </header>

    <main>
      <div class="container">
        <svg
          class="icon"
          role="img"
          aria-label="Page non trouvée"
          viewBox="0 -960 960 960"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
        >
          <title>Page non trouvée</title>
          <path
            d="M138.5-138.5Q80-197 80-280t58.5-141.5Q197-480 280-480t141.5 58.5Q480-363 480-280t-58.5 141.5Q363-80 280-80t-141.5-58.5ZM824-120 568-376q-12-13-25.5-26.5T516-428q38-24 61-64t23-88q0-75-52.5-127.5T420-760q-75 0-127.5 52.5T240-580q0 6 .5 11.5T242-557q-18 2-39.5 8T164-535q-2-11-3-22t-1-23q0-109 75.5-184.5T420-840q109 0 184.5 75.5T680-580q0 43-13.5 81.5T629-428l251 252-56 56Zm-615-61 71-71 70 71 29-28-71-71 71-71-28-28-71 71-71-71-28 28 71 71-71 71 28 28Z"
          />
        </svg>
        <h1>404</h1>
        <h2>Page introuvable</h2>
        <p>
          Désolé, la page que vous recherchez n'existe pas ou a été déplacée.
        </p>
        <div class="actions">
          <button
            onclick="
              history.length > 1 ? history.back() : (location.href = '/')
            "
            class="btn btn-outline"
          >
            <svg
              class="btn-icon"
              role="img"
              aria-label="Page précédente"
              viewBox="0 -960 960 960"
              fill="currentColor"
              xmlns="http://www.w3.org/2000/svg"
            >
              <title>Page précédente</title>
              <path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z" />
            </svg>
            Page précédente
          </button>
          <a href="/" class="btn btn-primary">
            <svg
              class="btn-icon"
              role="img"
              aria-label="Accueil"
              viewBox="0 -960 960 960"
              fill="currentColor"
              xmlns="http://www.w3.org/2000/svg"
            >
              <title>Accueil</title>
              <path
                d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"
              />
            </svg>
            Accueil
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
