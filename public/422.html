<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Requête invalide - CoopComm.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@8..144,100..1000&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    /* Thème corporate de DaisyUI */
    :root {
      --primary: #0082ce;
      --primary-hover: #0082ce;
      --primary-content: #ffffff;
      --base-100: #ffffff;
      --base-200: #e8e8e8;
      --base-300: #d1d1d1;
      --base-content: #181a2a;
      --base-content-muted: #6b7280;
      --warning: #fdc700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Google Sans Flex', system-ui, -apple-system, sans-serif;
      background-color: var(--base-100);
      color: var(--base-content);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar — cachée sur mobile, visible à partir de lg (1024px) */
    .navbar {
      display: none;
    }

    @media (min-width: 1024px) {
      .navbar {
        display: flex;
        align-items: center;
        background-color: var(--base-100);
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        padding: 0;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
        min-height: 4rem;
      }

      main {
        padding-top: 4rem;
      }
    }

    .navbar-inner {
      display: flex;
      align-items: center;
      flex: 1;
    }

    .navbar-logo {
      height: 2rem;
      padding-right: 0.25rem;
      margin-left: 1.5rem;
      display: block;
    }

    /* Main content */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      text-align: center;
      max-width: 32rem;
    }

    .icon {
      width: 96px;
      height: 96px;
      display: block;
      margin: 0 auto 1.5rem;
      color: var(--warning);
    }

    .btn-icon {
      width: 1.25em;
      height: 1.25em;
      flex-shrink: 0;
    }

    h1 {
      font-size: 5rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 1rem;
      color: var(--base-content);
    }

    @media (min-width: 1024px) {
      h1 {
        font-size: 7rem;
      }
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--base-content);
    }

    @media (min-width: 1024px) {
      h2 {
        font-size: 1.875rem;
      }
    }

    p {
      color: var(--base-content-muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      justify-content: center;
    }

    @media (min-width: 640px) {
      .actions {
        flex-direction: row;
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      border: 2px solid transparent;
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--primary-content);
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--primary);
      border-color: var(--primary);
    }

    .btn-outline:hover {
      background-color: var(--primary);
      color: var(--primary-content);
    }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="/">
        <img src="/CoopComm.png" alt="CoopComm" class="navbar-logo">
      </a>
    </div>
  </header>

  <main>
    <div class="container">
      <svg
        class="icon"
        role="img"
        aria-label="warning"
        viewBox="0 -960 960 960"
        fill="currentColor"
        xmlns="http://www.w3.org/2000/svg"
      >
        <title>warning</title>
        <path
          d="m40-120 440-760 440 760H40Zm138-80h604L480-720 178-200Zm330.5-51.5Q520-263 520-280t-11.5-28.5Q497-320 480-320t-28.5 11.5Q440-297 440-280t11.5 28.5Q463-240 480-240t28.5-11.5ZM440-360h80v-200h-80v200Zm40-100Z"
        />
      </svg>
      <h1>422</h1>
      <h2>Requête invalide</h2>
      <p>La requête envoyée n'a pas pu être traitée. Cela peut être dû à une session expirée. Veuillez rafraîchir la
        page et réessayer.</p>
      <div class="actions">
        <button onclick="location.reload()" class="btn btn-outline">
          <svg
            class="btn-icon"
            role="img"
            aria-label="Rafraîchir"
            viewBox="0 -960 960 960"
            fill="currentColor"
            xmlns="http://www.w3.org/2000/svg"
          >
            <title>Rafraîchir</title>
            <path
              d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"
            />
          </svg>
          Rafraîchir
        </button>
        <a href="/" class="btn btn-primary">
          <svg
            class="btn-icon"
            role="img"
            aria-label="Accueil"
            viewBox="0 -960 960 960"
            fill="currentColor"
            xmlns="http://www.w3.org/2000/svg"
          >
            <title>Accueil</title>
            <path
              d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"
            />
          </svg>
          Accueil
        </a>
      </div>
    </div>
  </main>
</body>

</html>
