<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navigateur non supporté - CoopComm.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@8..144,100..1000&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    /* Thème corporate de DaisyUI */
    :root {
      --primary: #0082ce;
      --primary-hover: #0082ce;
      --primary-content: #ffffff;
      --base-100: #ffffff;
      --base-200: #e8e8e8;
      --base-300: #d1d1d1;
      --base-content: #181a2a;
      --base-content-muted: #6b7280;
      --accent: #009689;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Google Sans Flex', system-ui, -apple-system, sans-serif;
      background-color: var(--base-100);
      color: var(--base-content);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar — cachée sur mobile, visible à partir de lg (1024px) */
    .navbar {
      display: none;
    }

    @media (min-width: 1024px) {
      .navbar {
        display: flex;
        align-items: center;
        background-color: var(--base-100);
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        padding: 0;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
        min-height: 4rem;
      }

      main {
        padding-top: 4rem;
      }
    }

    .navbar-inner {
      display: flex;
      align-items: center;
      flex: 1;
    }

    .navbar-logo {
      height: 2rem;
      padding-right: 0.25rem;
      margin-left: 1.5rem;
      display: block;
    }

    /* Main content */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      text-align: center;
      max-width: 36rem;
    }

    .icon {
      font-size: 96px;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1rem;
      color: var(--base-content);
    }

    @media (min-width: 1024px) {
      h1 {
        font-size: 2.5rem;
      }
    }

    p {
      color: var(--base-content-muted);
      margin-bottom: 1rem;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="/">
        <img src="/CoopComm.png" alt="CoopComm" class="navbar-logo">
      </a>
    </div>
  </header>

  <main>
    <div class="container">
      <span class="material-symbols-outlined icon">browser_not_supported</span>
      <h1>Votre navigateur n'est pas supporté</h1>
      <p>
        Pour des raisons de sécurité et de compatibilité, notre plateforme ne prend pas en charge votre navigateur
        actuel.
      </p>
      <p>
        Veuillez mettre à jour votre navigateur pour accéder à CoopComm.
      </p>
    </div>
  </main>
</body>

</html>
