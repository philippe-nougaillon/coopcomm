# Audit `create` pour tonte_locaux. En production, toute intervention créée via
# l'app possède un audit (gem `audited`) ; les fixtures, elles, n'en ont aucun.
# Cet audit réaliste évite que la souscription `on_intervention_updated` tombe sur
# `audits.last == nil` lors d'une mise à jour de tonte_locaux dans les tests.
# `audited_changes` vide (hash) → aucun champ « commentaires » → pas de job déclenché.
tonte_locaux_create:
  auditable_type: Intervention
  auditable_id: <%= ActiveRecord::FixtureSet.identify(:tonte_locaux) %>
  user_type: User
  user_id: <%= ActiveRecord::FixtureSet.identify(:weil) %>
  action: create
  audited_changes: "--- {}\n"
  version: 1
  created_at: <%= 2.days.ago %>
